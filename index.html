<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker - demo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #111214; --surface: #18191c; --surface2: #1f2023;
    --border: #2a2b2e;
    --green: #4a7c59; --text: #d1d3d8; --muted: #565a61; --white: #e8eaed;
    
    --brand: #8b7fc0;
    --brand-ink: #efeaff;                    
    --accent: var(--brand);                  
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --surface: #ffffff; --surface2: #eceff3;
    --border: #d7dbe1;
    --green: #3f8a5b; --text: #23272e; --muted: #7b828c; --white: #10131a;
    --brand: #6f5fa8;
    --brand-ink: #ffffff;
    --accent: var(--brand);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--white); }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { background: var(--surface2); color: #b9924a; border: 1px solid #3a3220; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
  main { padding: 20px 24px; max-width: 1180px; margin: 0 auto; }

  
  nav.tabs { display: flex; gap: 4px; padding: 10px 24px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab-btn { background: none; border: none; color: var(--muted); padding: 9px 18px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; transition: all .15s; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--white); border-bottom-color: var(--accent); }
  .tab { display: none; }
  .tab.active { display: block; }

  
  #metrics { background: none; border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 0 2px 16px; margin-bottom: 16px; }
  .m-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .m-stat { text-align: center; }
  .m-num { font-size: 26px; font-weight: 800; color: var(--white); line-height: 1; }
  .m-num.amber { color: #b9924a; }
  .m-num.gold { color: #e3b341; }
  .m-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .m-div { width: 1px; align-self: stretch; background: var(--border); }
  .m-deadlines { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
  .m-dl { background: none; border: none; border-left: 1px solid var(--border); border-radius: 0; padding: 2px 0 2px 10px; font-size: 12px; }
  .m-dl b { color: var(--white); }
  .m-dl.urgent { }
  .m-dl.urgent b { color: #c98a4a; }
  .m-progress { height: 6px; background: var(--bg); border-radius: 3px; margin-top: 14px; overflow: hidden; }
  .m-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .3s; }

  
  .m-cats { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .cat-chip { background: none; border: none; color: var(--muted); border-radius: 0; padding: 4px 2px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; border-bottom: 2px solid transparent; transition: all .15s; }
  .cat-chip:hover { color: var(--text); }
  .cat-chip.active { color: var(--white); border-bottom-color: var(--brand); }
  .cat-chip .cnt { font-size: 11px; opacity: .7; }

  
  .layout { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; align-items: start; }
  @media(max-width:860px){ .layout { grid-template-columns: 1fr; } }
  .panel { background: none; border: none; border-radius: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
  .panel-head h2 { font-size: 15px; font-weight: 700; }
  .panel-head .ctx { font-size: 12px; color: var(--muted); font-weight: 500; }
  .btn { background: color-mix(in srgb, var(--brand) 22%, var(--surface2)); color: var(--white); border: 1px solid color-mix(in srgb, var(--brand) 55%, var(--border)); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .15s, border-color .15s; }
  .btn:hover { background: color-mix(in srgb, var(--brand) 34%, var(--surface2)); border-color: var(--brand); }
  
  .btn.secondary { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .btn.secondary:hover { background: var(--surface2); border-color: var(--muted); }

  
  
  .task-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 9px 12px; margin-bottom: 6px; border-radius: 6px; background: var(--surface); transition: background .1s; }
  .task-row:last-child { margin-bottom: 0; }
  .task-row:hover { background: var(--surface2); }
  .task-row input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; }
  .chip { font-size: 11px; font-weight: 700; padding: 0; white-space: nowrap; flex-shrink: 0; cursor: pointer; background: none; color: var(--c); border: none; }
  .t-txt { flex: 1; min-width: 0; line-height: 1.35; font-size: 12px; cursor: text; }
  .task-row.pri .t-txt { font-weight: 600; color: var(--white); }
  .task-row.done .t-txt { color: var(--muted); text-decoration: line-through; }
  .task-row.done .chip { opacity: .5; }
  .t-edit { flex: 1; background: var(--surface2); border: 1px solid var(--accent); border-radius: 6px; padding: 4px 8px; color: var(--text); font-size: 12px; font-family: inherit; }
  .t-edit:focus { outline: none; }
  
  .t-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
  .t-rline { display: flex; align-items: center; gap: 5px; }
  .pri-tag { font-size: 13px; line-height: 1; padding: 0; flex-shrink: 0; cursor: pointer; background: none; border: none; }
  .pri-tag.p0 { color: var(--muted); opacity: .35; }
  .pri-tag.p0:hover { opacity: .7; }
  .pri-tag.p1 { color: #d64545; opacity: 1; }
  .state-tag { font-size: 10px; font-weight: 700; padding: 0; flex-shrink: 0; cursor: pointer; white-space: nowrap; background: none; border: none; }
  .state-tag.none { color: var(--muted); }
  .state-tag.started { color: #5fbf80; }
  .state-tag.waiting { color: #c79a4a; }
  .state-tag.finished { color: var(--muted); cursor: default; }
  .t-due { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .t-due.urgent { color: #c98a4a; font-weight: 600; }
  .t-actions { display: flex; gap: 2px; opacity: 0; flex-shrink: 0; }
  .task-row:hover .t-actions { opacity: 1; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 2px 5px; border-radius: 5px; color: var(--muted); font-size: 13px; }
  .icon-btn:hover { background: var(--border); color: var(--text); }

  
  .board2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 760px) { .board2 { grid-template-columns: 1fr; } }
  .panel-head .tg-cnt { background: none; color: var(--muted); padding: 0 2px; font-size: 11px; font-weight: 700; margin-left: 6px; }
  
  .panel.panel-started .panel-head { color: #5fbf80; border-bottom-color: #244a30; }
  .tgroup-empty { padding: 16px; color: var(--muted); font-size: 12px; font-style: italic; text-align: center; }
  
  
  .task-row.is-waiting { background: color-mix(in srgb, #c79a4a 15%, var(--surface)); }
  .task-row.is-waiting:hover { background: color-mix(in srgb, #c79a4a 22%, var(--surface)); }
  
  details.done-fold { border-top: 1px solid var(--border); }
  details.done-fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); user-select: none; }
  details.done-fold > summary::-webkit-details-marker { display: none; }
  details.done-fold > summary::before { content: '▸'; font-size: 10px; }
  details.done-fold[open] > summary::before { content: '▾'; }
  details.done-fold > summary:hover { color: var(--text); }
  details.done-fold .tg-cnt { background: none; color: var(--muted); padding: 0 2px; font-size: 10px; font-weight: 700; }

  
  
  
  .note-dot { font-size: 10px; line-height: 1; color: var(--accent); flex-shrink: 0; }
  
  .t-notes { display: none; flex-basis: 100%; width: 100%; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border); cursor: text; }
  .task-row:hover .t-notes, .task-row.notes-open .t-notes { display: block; }
  .t-notes .n-row { display: flex; align-items: center; gap: 9px; padding: 3px 0; font-size: 12px; }
  .t-notes .n-on { color: var(--muted); font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0; width: 42px; }
  .t-notes .n-tx { color: var(--text); line-height: 1.45; word-break: break-word; flex: 1; }
  .t-notes .n-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0 3px; opacity: 0; flex-shrink: 0; }
  .t-notes .n-row:hover .n-del { opacity: 1; }
  .t-notes .n-hint { color: var(--muted); font-size: 10px; padding-top: 4px; }
  .t-notes input { flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; padding: 4px 7px; font-family: inherit; }
  .t-notes input:focus { outline: none; border-color: var(--accent); }
  .state-menu { position: absolute; z-index: 300; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); min-width: 132px; }
  .state-menu button { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: none; color: var(--text); font-size: 12px; font-weight: 600; padding: 7px 10px; border-radius: 6px; cursor: pointer; text-align: left; white-space: nowrap; }
  .state-menu button:hover { background: var(--surface2); }
  .state-menu button.cur { color: var(--white); }
  .state-menu button.cur::after { content: '✓'; margin-left: auto; color: var(--muted); font-size: 11px; }
  .state-menu .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  
  .empty { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #22252a; color: #e8eaed; border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 100; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 460px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow-y: auto; }
  
  #jobModalBg .modal { width: 760px; }
  .modal h3 { font-size: 16px; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-full { grid-column: 1/-1; }
  label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; letter-spacing: .04em; }
  input, select, textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; color: var(--text); font-size: 13px; font-family: inherit; }
  input[type=checkbox], input[type=radio] { width: auto; padding: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 56px; }
  .check-row { display: flex; align-items: center; gap: 8px; }
  .check-row input { width: auto; }
  .check-row label { margin: 0; text-transform: none; font-size: 13px; color: var(--text); font-weight: 500; }
  .prep-head { font-size: 12px; font-weight: 800; color: var(--text); text-transform: uppercase; letter-spacing: .04em; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 2px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  
  .head-right { display: flex; align-items: center; gap: 10px; }
  .sync { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .logout { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 11px; padding: 3px 10px; border-radius: 14px; cursor: pointer; }
  .logout:hover { color: var(--text); }
  .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 340px; max-width: 100%; }
  .auth-box h2 { font-size: 22px; color: var(--white); margin-bottom: 4px; }
  .auth-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .auth-box input { width: 100%; margin-bottom: 10px; }
  .auth-box .btn { width: 100%; margin-top: 6px; padding: 10px; }
  .auth-error { color: #c98a6a; font-size: 12px; min-height: 15px; margin: 2px 0 6px; }
  .auth-local { background: none; border: none; color: var(--muted); font-size: 11px; text-decoration: underline; cursor: pointer; width: 100%; margin-top: 12px; font-family: inherit; }
  .auth-local:hover { color: var(--text); }

  
  @media (max-width: 640px) {
    body { font-size: 12px; }
    header { padding: 9px 12px; flex-wrap: wrap; gap: 5px; }
    header h1 { font-size: 14px; }
    header .sub { font-size: 9px; margin-top: 1px; }
    .head-right { gap: 5px; }
    .badge { font-size: 9px; padding: 2px 7px; }
    .sync { font-size: 9px; }
    .logout { font-size: 9px; padding: 2px 7px; }
    main { padding: 10px 10px; }

    #metrics { padding: 10px 10px; margin-bottom: 12px; border-radius: 10px; }
    .m-row { gap: 10px; }
    .m-num { font-size: 16px; }
    .m-lbl { font-size: 8px; margin-top: 2px; }
    .m-deadlines { gap: 6px; }
    .m-dl { font-size: 9px; padding: 3px 7px; }
    .m-progress { margin-top: 10px; }
    .m-cats { gap: 6px; margin-top: 10px; }
    .cat-chip { font-size: 10px; padding: 3px 8px; }
    .cat-chip .cnt { font-size: 9px; }

    nav.tabs { padding: 6px 10px 0; }
    .tab-btn { font-size: 11px; padding: 6px 11px; }

    .panel-head { padding: 9px 11px; }
    .panel-head h2 { font-size: 12px; }
    .panel-head .ctx { font-size: 10px; }
    .btn { font-size: 11px; padding: 5px 10px; }

    
    .task-row { gap: 8px; padding: 7px 10px; }
    .chip { font-size: 9px; padding: 1px 6px; }
    .t-txt, .t-edit { font-size: 12px; line-height: 1.3; }
    .pri-tag { font-size: 9px; padding: 1px 5px; }
    .pri-tag.p0 { display: none; }              
    .state-tag { font-size: 9px; padding: 1px 7px; }
    .t-due { font-size: 10px; }
    .t-actions { opacity: 1; }
    .icon-btn { font-size: 15px; padding: 2px 4px; }

  }

  
  @media (max-width: 380px) {
    body { font-size: 11px; }
    header h1 { font-size: 13px; }
    .m-num { font-size: 15px; }
    .m-row { gap: 8px; }
    .tab-btn { font-size: 10px; padding: 6px 9px; }
    .t-txt, .t-edit { font-size: 11px; }
    .panel-head h2 { font-size: 11px; }
  }

  
  
  a.side-btn { text-decoration: none; }
  .side-sep { height: 1px; background: var(--border); margin: 6px 10px; }
  
  .side-btn { justify-content: center; padding: 9px; position: relative; }
  .side-btn[data-tip]:hover::after, .side-btn[data-tip]:focus-visible::after {
    content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%);
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; z-index: 200;
    box-shadow: 0 8px 22px rgba(0,0,0,.35); pointer-events: none; }
  .hub-btn { color: var(--text); }
  .hub-flyout { position: fixed; z-index: 90; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px; min-width: 178px; box-shadow: 0 14px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 2px; }
  .hub-flyout[hidden] { display: none; }
  .hub-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .hub-item:hover { background: var(--surface2); color: var(--white); }
  .hub-item .hi { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .hub-item .hi svg { width: 17px; height: 17px; display: block; }
  .hub-item.is-current { color: var(--white); background: var(--surface2); cursor: default; }
  .hub-item.is-current .here { margin-left: auto; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  
  .view { display: none; }
  .view.active { display: block; }
  .app-shell { display: flex; min-height: 100vh; align-items: stretch; }
  .sidebar { width: 54px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; padding: 12px 0; transition: width .16s ease; overflow: visible; z-index: 40; position: sticky; top: 0; height: 100vh; }
  .side-nav, .side-foot { display: flex; flex-direction: column; gap: 3px; padding: 0 8px; }
  .side-btn { display: flex; align-items: center; gap: 11px; width: 100%; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: .01em; padding: 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; text-align: left; }
  .side-btn .si { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .side-btn .si svg { width: 19px; height: 19px; display: block; }
  .side-btn:hover { background: var(--surface2); color: var(--text); }
  .side-btn.active { color: var(--white); background: color-mix(in srgb, var(--brand) 22%, var(--surface2)); }
  main.content { flex: 1; min-width: 0; max-width: none; margin: 0; padding: 20px 24px; }
  
  .settings-menu { position: fixed; left: 62px; bottom: 14px; z-index: 60; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 5px; min-width: 172px; box-shadow: 0 12px 40px rgba(0,0,0,.42); display: flex; flex-direction: column; gap: 1px; font-family: inherit; }
  .settings-menu[hidden] { display: none; }
  .settings-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); font-size: 13px; font-weight: 500; letter-spacing: .01em; padding: 8px 12px; border-radius: 7px; cursor: pointer; transition: background .1s; }
  .settings-menu button:hover { background: var(--surface2); }
  .settings-menu .sm-sep { height: 1px; background: var(--border); margin: 4px 6px; }
  .settings-menu .sm-danger { color: var(--muted); }
  .settings-menu .sm-danger:hover { color: var(--white); }
  
  .content-head { margin: 0 0 14px; }
  .content-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .app-title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; color: var(--white); margin: 0; }
  
  .dash-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .dash-card #metrics { margin: 0; }
  .dash-card .cal { background: none; border: none; border-radius: 0; padding: 0; }
  
  .dash-band { display: grid; grid-template-columns: 1fr 236px; gap: 18px; align-items: stretch; margin-bottom: 18px; }
  @media (max-width: 760px) { .dash-band { grid-template-columns: 1fr; } }
  .dash-metrics { min-width: 0; }
  .dash-metrics #metrics { display: flex; flex-direction: column; gap: 12px; }
  .dash-cal { padding: 10px 12px; }
  .task-row[draggable="true"] { cursor: grab; }
  .task-row.dragging { opacity: .5; }
  
  body.dragging .dash-band { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-bottom: 8px; }
  body.dragging .dash-cal { outline: 1.5px dashed var(--accent); outline-offset: 2px; }
  .panel.drop-panel { outline: 1.5px dashed var(--green); outline-offset: 6px; border-radius: 8px; }
  
  .task-row.pri:not(.is-waiting) { background: color-mix(in srgb, #d64545 13%, var(--surface)); }
  .task-row.pri:not(.is-waiting):hover { background: color-mix(in srgb, #d64545 20%, var(--surface)); }
  
  .tasklist-head { display: flex; justify-content: flex-end; margin-bottom: 4px; }
  
  .cat-group { margin-top: 14px; }
  .cat-group:first-child { margin-top: 0; }
  .cat-group-head { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px 2px; display: flex; align-items: center; gap: 6px; }
  .cat-group-head .cg-count { color: var(--accent); font-weight: 700; }
  
  .cal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-size: 12px; font-weight: 800; color: var(--white); }
  .cal-nav { background: none; border: 1px solid var(--border); color: var(--muted); width: 20px; height: 20px; border-radius: 5px; cursor: pointer; font-size: 11px; }
  .cal-nav:hover { color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .cal-dow { font-size: 8px; font-weight: 700; color: var(--muted); text-align: center; text-transform: uppercase; padding: 1px 0; }
  .cal-cell { position: relative; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--text); border-radius: 5px; }
  .cal-cell.other { color: var(--border); }
  .cal-cell.today { outline: 1.5px solid var(--accent); }
  
  .cal-cell.has { background: color-mix(in srgb, var(--brand) 24%, var(--surface)); color: var(--white); font-weight: 700; cursor: grab; }
  .cal-cell.has.urgent { background: color-mix(in srgb, #c25a4a 22%, var(--surface)); }
  .cal-cell.cal-hl { outline: 2px solid var(--brand); outline-offset: -1px; z-index: 1; }
  .cal-cell.drop-ok { background: color-mix(in srgb, var(--green) 32%, var(--surface)); outline: 1.5px dashed var(--green); color: var(--white); }
  .cal-dot { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; border-radius: 50%; background: var(--brand); }
</style>
</head>
<body>

<style>
  
  .auth-remember { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px;
                   font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .auth-remember input { width: 14px; height: 14px; margin: 0; cursor: pointer; accent-color: var(--brand, #8b7fc0); }
</style>
<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <h2>Tasks</h2>
    <div class="auth-sub">Log in to sync your tasks across devices</div>
    <input id="auth-email" type="email" placeholder="Email" autocomplete="username">
    <input id="auth-pass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="auth-error" id="authError"></div>
    <label class="auth-remember"><input type="checkbox" id="auth-remember" checked> Remember me on this computer</label>
    <button class="btn" onclick="doLogin()">Log in</button>
    <button class="btn secondary" onclick="doSignup()">Create account</button>
    <button class="auth-local" onclick="useLocalOnly()">Skip - use this device only</button>
  </div>
</div>

<div class="app-shell">
  <aside class="sidebar">
    <nav class="side-nav" id="appNav"></nav>
    <div class="side-foot">
      <span id="syncBadge" hidden></span>
      <button class="side-btn settings-btn" data-tip="Settings" onclick="toggleSettings(event)"><span class="si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9"/><path d="M17 7h3"/><circle cx="15" cy="7" r="2"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="9" cy="17" r="2"/></svg></span></button>
    </div>
  </aside>

  <main class="content">

<div class="view active" id="view-board">
  <div class="content-head"><h1 class="app-title">Task Tracker</h1></div>
  <div class="demo-note"><b>Demo.</b> The tasks below are made up, and anything you change is saved only in this browser. Add Supabase keys to turn on accounts and cross-device sync.</div>
  <div class="dash-band">
    <div class="dash-card dash-metrics"><section id="metrics"></section></div>
    <div class="dash-card dash-cal"><div id="calendar"></div></div>
  </div>

</div>

  </main>
</div>

<div id="settingsMenu" class="settings-menu" hidden>
  <button onclick="exportBackup(); hideSettings()">Backup</button>
  <button onclick="document.getElementById('restoreFile').click(); hideSettings()">Restore</button>
  <button onclick="hideSettings(); openHistory(event)">History</button>
  <button onclick="toggleTheme()"><span id="themeLabel">Light theme</span></button>
  <div class="sm-sep"></div>
  <button onclick="hideSettings(); showAuth()">Switch account / sign in</button>
  <button class="sm-danger" onclick="signOut()">Log out</button>
  <input type="file" id="restoreFile" accept="application/json,.json" style="display:none" onchange="restoreBackup(this.files[0]); this.value=''">
</div>

<div class="modal-bg" id="taskModalBg">
  <div class="modal">
    <h3 id="taskModalTitle">Add Task</h3>
    <div class="form-grid">
      <div class="form-full">
        <label>Task</label>
        <textarea id="t-text" placeholder="What needs to be done"></textarea>
      </div>
      <div>
        <label>Category</label>
        <select id="t-cat"></select>
      </div>
      <div>
        <label>Priority</label>
        <select id="t-pri">
          <option value="0">None</option>
          <option value="1">P1</option>
        </select>
      </div>
      <div>
        <label>Status</label>
        <select id="t-state">
          <option value="none">None</option>
          <option value="started">Started</option>
          <option value="waiting">Waiting</option>
        </select>
      </div>
      <div>
        <label>Due date (optional)</label>
        <input id="t-due" type="date">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeTaskModal()">Cancel</button>
      <button class="btn" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<script>

const PAGES = [
  { id:'board', label:'Tracker', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6h10.5"/><path d="M9.5 12h10.5"/><path d="M9.5 18h10.5"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/><path d="M4 18l1 1 2-2"/></svg>' },
];

const SHOW_HUB = false;
const APP_ID = 'tasks';
const HUB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>';
const HUB_APPS = [];
function appUrl(a) {
  try { const o = JSON.parse(localStorage.getItem('app_links') || '{}'); return o[a.id] || a.url; } catch (e) { return a.url; }
}

function currentTheme() {
  return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
}
function themeFromUrl() {
  const m = (location.hash + ' ' + location.search).match(/theme=(dark|light)/);
  return m ? m[1] : '';
}
function withTheme(url) {
  const t = currentTheme();
  if (/^https?:/.test(url)) return url + (url.indexOf('?') < 0 ? '?' : '&') + 'theme=' + t;
  return url + (url.indexOf('#') < 0 ? '#' : '&') + 'theme=' + t;
}
let activePage = PAGES[0].id;
function renderNav() {
  const nav = document.getElementById('appNav'); if (!nav) return;
  const hub = SHOW_HUB
    ? `<button class="side-btn hub-btn" data-tip="My apps" onmouseenter="showHub(this)" onmouseleave="hideHubSoon()" onclick="showHub(this)"><span class="si">${HUB_ICON}</span></button><div class="side-sep"></div>`
    : '';
  nav.innerHTML = hub + PAGES.map(p =>
    `<button class="side-btn${p.id === activePage ? ' active' : ''}" data-tip="${p.label}" onclick="showPage('${p.id}')"><span class="si">${p.icon}</span></button>`).join('');
}
function showPage(id) {
  activePage = id;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + id));
  renderNav();
  if (typeof onPageShown === 'function') onPageShown(id);
}

let hubTimer = null;
function showHub(el) {
  if (!SHOW_HUB) return;
  clearTimeout(hubTimer);
  const f = document.getElementById('hubFlyout'); if (!f) return;

  f.innerHTML = HUB_APPS.map(a => a.id === APP_ID
    ? `<span class="hub-item is-current"><span class="hi">${a.icon}</span>${a.label}</span>`
    : `<a class="hub-item" href="${withTheme(appUrl(a))}"><span class="hi">${a.icon}</span>${a.label}</a>`).join('');
  const r = el.getBoundingClientRect();
  f.hidden = false;
  f.style.left = (r.right + 10) + 'px';
  f.style.top = Math.min(r.top, window.innerHeight - f.offsetHeight - 12) + 'px';
}
function keepHub() { clearTimeout(hubTimer); }
function hideHubSoon() {
  hubTimer = setTimeout(() => { const f = document.getElementById('hubFlyout'); if (f) f.hidden = true; }, 260);
}
renderNav();

const CATEGORIES = {
  quick:    { label: 'Quick',    icon: '⚡', color: '#c76b3a' },
  career:   { label: 'Career',   icon: '🎯', color: '#7a8494' },
  learning: { label: 'Learning', icon: '📚', color: '#9a8a5a' },
  project:  { label: 'Project',  icon: '📋', color: '#5a8a7a' },
  todo:     { label: 'To Do',    icon: '✅', color: '#8a6a9a' },
};
const CAT_ORDER = ['quick','career','learning','project','todo'];

const CAT_SORT  = ['quick','todo','career','project','learning'];

const MOVE = '2026-08-01';

const TASKS = [

  { id:'CA0', cat:'career', text:'Reply to the recruiter from Nimbus Robotics', pri:1, done:false, due:'2026-08-03' },
  { id:'CA1', cat:'career', text:'Update LinkedIn headline and About section', done:true },
  { id:'CA2', cat:'career', text:'Reach out to 3 hiring managers this week', pri:1, done:false, due:'2026-08-05' },
  { id:'CA3', cat:'career', text:'Rehearse the 5 core PM interview questions', done:false },
  { id:'CA4', cat:'career', text:'Apply to 5+ roles - log each one in the job board', done:false },
  { id:'CA5', cat:'career', text:'Write follow-up notes after the Volta EV interview', done:true },

  { id:'LE0', cat:'learning', text:'Read one chapter of "Inspired" (Marty Cagan)', pri:1, done:false },
  { id:'LE1', cat:'learning', text:'Finish the SQL basics course', done:false },
  { id:'LE2', cat:'learning', text:'Study GTM basics - pricing, launch, positioning', done:false },
  { id:'LE3', cat:'learning', text:'Review funnel metrics - acquisition, activation, retention', done:true },

  { id:'PR0', cat:'project', text:'Polish the portfolio case study', pri:1, done:false, due:'2026-08-10' },
  { id:'PR1', cat:'project', text:'Ship v1 of the side project', done:false },
  { id:'PR2', cat:'project', text:'Record a 2-minute product demo video', done:false },

  { id:'TD0', cat:'todo', text:'Book a dentist appointment', done:false },
  { id:'TD1', cat:'todo', text:'Renew gym membership', done:false, due:'2026-08-01' },
  { id:'TD2', cat:'todo', text:'Plan the weekend trip', done:false },
  { id:'TD3', cat:'todo', text:'Set up a weekly budget review', done:true },

  { id:'QK0', cat:'quick', text:'Send thank-you note after the Volta EV interview', pri:1, done:false, due:'2026-07-30' },
  { id:'QK1', cat:'quick', text:'Confirm reference availability with two contacts', done:false },
];
const SEED = 'v21';

let tasks = [], nextTaskId = 1;
let activeCat = null, editingTask = null, editingText = null;

const STATE_ORDER = ['none','started','waiting'];
const STATE_LABEL = { none:'Not started', started:'Started', waiting:'Waiting', finished:'Finished' };
const STATE_RANK  = { started:0, waiting:1, none:2 };
function escAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

const LS_STATE   = 'tasks_state';
const LS_BACKUPS = 'tasks_backups';
function loadState() {
  let s = null;
  const raw = localStorage.getItem(LS_STATE);
  if (raw) { try { s = JSON.parse(raw); } catch(e) {} }
  if (!s) {

    {
      tasks = TASKS.map(x => ({ ...x }));
      nextTaskId = tasks.length + 1;
    }
  } else {
    tasks = s.tasks || [];
    nextTaskId = s.nextTaskId || tasks.length + 1;

    if (s.seed !== SEED) {
      const have = new Set(tasks.map(x => x.id));
      TASKS.forEach(x => { if (!have.has(x.id)) tasks.push({ ...x }); });
    }
  }
  normalizeState();
  saveState();
  autoBackup();
}
function saveState() {
  localStorage.setItem(LS_STATE, JSON.stringify({ seed: SEED, tasks, nextTaskId }));
  schedulePush();
}

function exportBackup() {
  const payload = { seed: SEED, tasks, nextTaskId, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tasks-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  setSync('Backed up');
}
function restoreBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let d;
    try { d = JSON.parse(reader.result); } catch (e) { alert('That file is not valid JSON.'); return; }
    if (!d || !Array.isArray(d.tasks)) { alert('That backup has no tasks in it.'); return; }
    if (!confirm('Restore ' + d.tasks.length + ' tasks from this backup?\nThis replaces your current board (a snapshot of the current one is kept).')) return;
    autoBackup();
    localStorage.setItem(LS_STATE, JSON.stringify({ seed: d.seed || SEED, tasks: d.tasks, nextTaskId: d.nextTaskId }));
    loadState();
    renderAll();
    if (currentUser) pushToCloudNow();
    setSync('Restored');
  };
  reader.readAsText(file);
}

function autoBackup() {
  try {
    const arr = JSON.parse(localStorage.getItem(LS_BACKUPS) || '[]');
    arr.push({ ts: new Date().toISOString(), seed: SEED, tasks, nextTaskId });
    while (arr.length > 15) arr.shift();
    localStorage.setItem(LS_BACKUPS, JSON.stringify(arr));
  } catch (e) {}
}

function normalizeState() {
  tasks.forEach(t => {
    if (t.pri === undefined) t.pri = t.priority ? 1 : 0;
    delete t.priority;
    delete t.focus;
    if (t.state === undefined) t.state = 'none';
    if (!Array.isArray(t.notes)) t.notes = [];
    applyWaiting(t);
  });
  nextTaskId = Math.max(nextTaskId, 1);
}

function daysTo(due) {
  if (!due) return null;
  const d = new Date(due + 'T00:00:00'); const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}
function fmtDate(due) {
  return new Date(due + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function dueLabel(due) {
  const d = daysTo(due);
  if (d === null) return '';
  if (d < 0) return fmtDate(due) + ' (' + (-d) + 'd late)';
  if (d === 0) return 'Today';
  return fmtDate(due) + ' (' + d + 'd)';
}

function todayISO() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

function daysWaiting(t) {
  if (!t.waitingSince) return null;
  const s = new Date(t.waitingSince + 'T00:00:00'); const now = new Date(); now.setHours(0,0,0,0);
  return Math.max(0, Math.round((now - s) / 86400000));
}

function applyWaiting(t) {
  if (t.state === 'waiting') { if (!t.waitingSince) t.waitingSince = todayISO(); }
  else if (t.waitingSince) delete t.waitingSince;
}

function cmpInGroup(a, b) {
  const aq = a.cat === 'quick' ? 0 : 1, bq = b.cat === 'quick' ? 0 : 1;
  if (aq !== bq) return aq - bq;
  const al = a.pri > 0 ? 0 : 1, bl = b.pri > 0 ? 0 : 1;
  if (al !== bl) return al - bl;
  const da = daysTo(a.due), db = daysTo(b.due);
  if (da !== null && db !== null) { if (da !== db) return da - db; }
  else if (da !== null) return -1;
  else if (db !== null) return 1;
  return 0;
}

function buildMetrics() {
  const host = document.getElementById('metrics');
  const open = tasks.filter(t => !t.done);
  const pri  = open.filter(t => t.pri > 0).length;

  const dated = open.filter(t => t.due).sort(cmpByDue);
  const urgentCount = dated.filter(t => { const d = daysTo(t.due); return d !== null && d <= 7; }).length;
  const dueTitle = dated.length
    ? dated.map(t => `• ${dueLabel(t.due)} — ${t.text}`).join('\n')
    : 'No upcoming deadlines';

  host.innerHTML = `
    <div class="m-row">
      <div class="m-stat"><div class="m-num">${open.length}</div><div class="m-lbl">Open</div></div>
      <div class="m-div"></div>
      <div class="m-stat"><div class="m-num amber">${pri}</div><div class="m-lbl">P1</div></div>
      <div class="m-div"></div>
      <div class="m-stat" title="${escAttr(dueTitle)}" style="cursor:help"><div class="m-num${urgentCount?' amber':''}">${dated.length}</div><div class="m-lbl">Due</div></div>
    </div>
    <div class="m-cats" id="catBar"></div>
  `;

  const bar = document.getElementById('catBar');
  const allOpen = open.length;
  let chips = `<div class="cat-chip${activeCat===null?' active':''}" onclick="setFilter(null)">All <span class="cnt">${allOpen}</span></div>`;
  chips += CAT_ORDER.map(c => {
    const n = open.filter(t => t.cat === c).length;
    const cat = CATEGORIES[c];
    return `<div class="cat-chip${activeCat===c?' active':''}" onclick="setFilter('${c}')">${cat.icon} ${cat.label} <span class="cnt">${n}</span></div>`;
  }).join('');
  bar.innerHTML = chips;
}

function setFilter(c) { activeCat = c; buildMetrics(); buildTaskList(); }

function cmpByDue(a, b) {
  const da = daysTo(a.due), db = daysTo(b.due);
  if (da !== null && db !== null) { if (da !== db) return da - db; }
  else if (da !== null) return -1;
  else if (db !== null) return 1;
  return 0;
}

function cmpP1(a, b) {
  const ca = CAT_SORT.indexOf(a.cat), cb = CAT_SORT.indexOf(b.cat);
  const ra = ca < 0 ? 99 : ca, rb = cb < 0 ? 99 : cb;
  if (ra !== rb) return ra - rb;
  return cmpByDue(a, b);
}

function taskRowHTML(t) {
  const cat = CATEGORIES[t.cat] || { label:t.cat, icon:'', color:'#888' };
  const d = daysTo(t.due);
  const dueHTML = (t.due && !t.done) ? `<span class="t-due${d!==null&&d<=7?' urgent':''}">${dueLabel(t.due)}</span>` : '';
  const priHTML = `<span class="pri-tag p${t.pri>0?1:0}" onclick="openPriMenu('${t.id}',event)" title="${t.pri>0?'Priority — click to change':'Set priority'}">⚑</span>`;
  const st = t.done ? 'finished' : (t.state || 'none');
  let stateLabel = STATE_LABEL[st];
  if (st === 'waiting') { const wd = daysWaiting(t); if (wd !== null) stateLabel = `Waiting · ${wd}d`; }
  const stateHTML = t.done
    ? `<span class="state-tag finished" title="Done">${STATE_LABEL.finished}</span>`
    : `<span class="state-tag ${st}" onclick="openStateMenu('${t.id}',event)" title="Click to change status">${stateLabel}</span>`;
  const textHTML = editingText === t.id
    ? `<input id="taskEditInput" class="t-edit" value="${escAttr(t.text)}" onblur="commitText('${t.id}',this.value)" onkeydown="if(event.key==='Enter'){this.blur();}else if(event.key==='Escape'){cancelEditText();}">`
    : `<span class="t-txt" onclick="openTaskModal('${t.id}')" title="Click to edit">${t.text}</span>`;
  const hl = (!t.done && t.state === 'waiting') ? ' is-waiting' : '';

  const editing = notesEditFor === t.id;
  const drag = (t.done || editing) ? '' : ` draggable="true" ondragstart="taskDragStart(event,'${t.id}')" ondragend="taskDragEnd(event)" onmouseenter="hlCalDate('${t.due||''}',true)" onmouseleave="hlCalDate('${t.due||''}',false)"`;
  return `
    <div class="task-row${t.done?' done':''}${t.pri>0?' pri':''}${hl}${editing?' notes-open':''}" style="--c:${cat.color}" data-id="${t.id}" data-due="${t.due||''}"${drag}>
      <input type="checkbox" ${t.done?'checked':''} onclick="toggleTask('${t.id}')" title="Mark done">
      <span class="chip" style="--c:${cat.color}" onclick="openCatMenu('${t.id}',event)" title="Change category">${cat.icon} ${cat.label}</span>
      ${textHTML}
      <div class="t-right">
        <div class="t-rline">${noteDotHTML(t)}${priHTML}${stateHTML}</div>
        ${dueHTML}
      </div>
      <span class="t-actions">
        <button class="icon-btn" onclick="editNotes('${t.id}',event)" title="Add a note">📝</button>
        <button class="icon-btn" onclick="deleteTask('${t.id}')" title="Delete">🗑️</button>
      </span>
      ${notesBlockHTML(t)}
    </div>`;
}

function buildTaskList() {
  const host = document.getElementById('taskList');
  const ctx = activeCat ? `<span class="tg-cnt">${CATEGORIES[activeCat].icon} ${CATEGORIES[activeCat].label}</span>` : '';
  let list = tasks.slice();
  if (activeCat) list = list.filter(t => t.cat === activeCat);
  if (!list.length) { host.innerHTML = '<div class="panel"><div class="empty">No tasks here.</div></div>'; return; }

  const started = list.filter(t => !t.done && t.state === 'started').sort(cmpInGroup);

  const backlog = list.filter(t => !t.done && t.state !== 'started').sort((a, b) => {
    const aw = a.state === 'waiting' ? 0 : 1, bw = b.state === 'waiting' ? 0 : 1;
    if (aw !== bw) return aw - bw;
    return cmpInGroup(a, b);
  });
  const done = list.filter(t => t.done).sort(cmpInGroup);
  const rows = arr => arr.map(taskRowHTML).join('');

  const doneFold = done.length
    ? `<details class="done-fold"><summary>Done <span class="tg-cnt">${done.length}</span></summary>${rows(done)}</details>`
    : '';

  const drop = p => `data-panel="${p}" ondragover="panelDragOver(event,this)" ondragleave="panelDragLeave(event,this)" ondrop="panelDrop(event,this)"`;
  host.innerHTML = `<div class="board2">
    <div class="panel panel-started" ${drop('started')}>
      <div class="panel-head"><h2>▶ Started <span class="tg-cnt">${started.length}</span></h2><span class="btn" style="visibility:hidden" aria-hidden="true">+ Task</span></div>
      ${started.length ? rows(started) : '<div class="tgroup-empty">Nothing started. Drag one over from the backlog.</div>'}
      ${doneFold}

  const due = document.getElementById('t-due').value;

  } else {

function commitNotes(id, keepOpen) {
  const t = tasks.find(x => x.id === id);
  const box = document.querySelector(`.task-row[data-id="${id}"] .t-notes`);
  if (!t || !box) { cancelNotes(); return; }
  const kept = [];
  box.querySelectorAll('input[data-i]').forEach(inp => {
    const v = inp.value.trim();
    if (v) kept.push({ on: t.notes[Number(inp.dataset.i)].on, text: v });
  });
  const fresh = box.querySelector('#noteNew');
  const nv = fresh ? fresh.value.trim() : '';
  if (nv) kept.push({ on: todayISO(), text: nv });
  kept.sort((a, b) => a.on < b.on ? -1 : a.on > b.on ? 1 : 0);
  const changed = JSON.stringify(kept) !== JSON.stringify(t.notes || []);
  t.notes = kept;
  if (changed) { saveState(); buildMetrics(); }
  if (keepOpen) {
    buildTaskList();
    const inp = document.querySelector(`.task-row[data-id="${id}"] #noteNew`);
    if (inp) inp.focus();
    return;
  }
  cancelNotes();
}
function deleteNote(id, i) {
  const t = tasks.find(x => x.id === id); if (!t) return;

  const box = document.querySelector(`.task-row[data-id="${id}"] .t-notes`);
  if (box) box.querySelectorAll('input[data-i]').forEach(inp => {
    const j = Number(inp.dataset.i), v = inp.value.trim();
    if (t.notes[j] && v) t.notes[j].text = v;
  });
  t.notes.splice(i, 1);
  saveState(); buildTaskList(); buildMetrics();
  const inp = document.querySelector(`.task-row[data-id="${id}"] #noteNew`);
  if (inp) inp.focus();
}

function addNote(id, text) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  const v = String(text || '').trim(); if (!v) return;
  if (!Array.isArray(t.notes)) t.notes = [];
  t.notes.push({ on: todayISO(), text: v });
  saveState(); buildTaskList(); buildMetrics();
}

let calMonth = 0;
const MON_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function calShift(delta) { calMonth += delta; buildCalendar(); }
function buildCalendar() {
  const host = document.getElementById('calendar');
  if (!host) return;

  const byDay = {};
  tasks.filter(t => !t.done && t.due).forEach(t => { (byDay[t.due] = byDay[t.due] || []).push(t); });

  const today = new Date(); today.setHours(0,0,0,0);
  const base = new Date(today.getFullYear(), today.getMonth() + calMonth, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = ymd(today);

  const dow = ['S','M','T','W','T','F','S'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  const dropAttr = `ondragover="calDragOver(event,this)" ondragleave="this.classList.remove('drop-ok')" ondrop="taskDrop(event,this)"`;
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-cell other"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const dstr = ymd(new Date(y, m, day));
    const list = byDay[dstr] || [];
    const has = list.length > 0;
    const urgent = has && list.some(t => t.pri > 0);
    const cls = ['cal-cell'];
    if (dstr === todayStr) cls.push('today');
    if (has) { cls.push('has'); if (urgent) cls.push('urgent'); }
    const title = has ? list.map(t => `• ${t.text}`).join('\n') : '';
    cells += `<div class="${cls.join(' ')}" data-date="${dstr}" ${dropAttr}${has ? ` title="${escAttr(title)}"` : ''}>${day}${has ? '<span class="cal-dot"></span>' : ''}</div>`;
  }

  host.innerHTML = `<div class="cal">
    <div class="cal-head">
      <button class="cal-nav" onclick="calShift(-1)" title="Previous month">‹</button>
      <div class="cal-title">${MON_NAMES[m]} ${y}</div>
      <button class="cal-nav" onclick="calShift(1)" title="Next month">›</button>
    </div>
    <div class="cal-grid">${dow}${cells}</div>
  </div>`;
}

let dragTaskId = null;
function taskDragStart(e, id) {
  dragTaskId = id;
  if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', id); } catch(_){} }
  const row = e.target.closest && e.target.closest('.task-row');

function taskDragEnd(e) {

  document.querySelectorAll('.task-row.dragging').forEach(r => r.classList.remove('dragging'));
  document.querySelectorAll('.cal-cell.drop-ok').forEach(c => c.classList.remove('drop-ok'));
  document.querySelectorAll('.panel.drop-panel').forEach(p => p.classList.remove('drop-panel'));
}

function draggedTask(e) {
  const id = dragTaskId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  return tasks.find(x => x.id === id) || null;
}
function calDragOver(e, cell) {
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  cell.classList.add('drop-ok');
}
function taskDrop(e, cell) {
  e.preventDefault();
  cell.classList.remove('drop-ok');
  const date = cell.getAttribute('data-date');
  const t = draggedTask(e);
  if (t && date) { t.due = date; saveState(); renderAll(); toast('Due ' + dueLabel(date)); }
  dragTaskId = null;
  document.body.classList.remove('dragging');
}

function panelDragOver(e, panel) {
  if (!dragTaskId) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  panel.classList.add('drop-panel');
}
function panelDragLeave(e, panel) {

  if (e.relatedTarget && panel.contains(e.relatedTarget)) return;
  panel.classList.remove('drop-panel');
}
function panelDrop(e, panel) {
  e.preventDefault();
  panel.classList.remove('drop-panel');
  const t = draggedTask(e);
  dragTaskId = null;
  document.body.classList.remove('dragging');
  if (!t) return;
  const to = panel.getAttribute('data-panel');
  if (to === 'started') {
    if (t.state === 'started') return;
    t.state = 'started';
  } else {
    if (t.state !== 'started') return;
    t.state = 'none';
  }
  applyWaiting(t);
  saveState(); renderAll();
  toast(to === 'started' ? 'Started' : 'Back in the backlog');
}

const SUPABASE_URL = '';
const SUPABASE_KEY = '';

const DEMO_MODE = !SUPABASE_URL || !SUPABASE_KEY;
const sb = DEMO_MODE ? null : window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let pushTimer = null;
let cloudUpdatedAt = null;
let lastSnapshotTs = 0;

function setSync(text) { const el = document.getElementById('syncBadge'); if (el) el.textContent = text; }
function renderAll() { buildMetrics(); buildTaskList(); buildCalendar(); }

async function snapshotNow() {
  if (!currentUser) return;
  try {
    await sb.from('task_snapshots').insert({ user_id: currentUser.id, data: { seed: SEED, tasks, nextTaskId } });
    const { data: extra } = await sb.from('task_snapshots').select('id').eq('user_id', currentUser.id).order('created_at', { ascending: false }).range(50, 500);
    if (extra && extra.length) await sb.from('task_snapshots').delete().in('id', extra.map(r => r.id));
  } catch (e) {  }
}
function maybeSnapshot() {
  const now = Date.now();
  if (now - lastSnapshotTs > 120000) { lastSnapshotTs = now; snapshotNow(); }
}

async function pushToCloudNow() {
  if (!currentUser) return;
  const payload = { seed: SEED, tasks, nextTaskId };
  setSync('Saving...');
  let conflict = false;
  try {
    const { data: cur } = await sb.from('task_state').select('updated_at').eq('user_id', currentUser.id).maybeSingle();
    if (cur && cur.updated_at && cloudUpdatedAt && cur.updated_at > cloudUpdatedAt) { conflict = true; await snapshotNow(); }
  } catch (e) {}
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('task_state').upsert({ user_id: currentUser.id, data: payload, updated_at: nowIso });
  if (error) { setSync('Offline'); return; }
  cloudUpdatedAt = nowIso;
  setSync(conflict ? 'Merged' : 'Synced');
  maybeSnapshot();
}
function schedulePush() {
  if (!currentUser) return;
  clearTimeout(pushTimer);
  setSync('Saving...');
  pushTimer = setTimeout(() => pushToCloudNow().catch(() => setSync('Offline')), 2000);
}

async function loadFromCloud() {
  try {
    const { data, error } = await sb.from('task_state').select('data, updated_at').eq('user_id', currentUser.id).maybeSingle();
    if (error) throw error;
    if (data && data.data && Array.isArray(data.data.tasks) && data.data.tasks.length) {
      cloudUpdatedAt = data.updated_at || null;
      localStorage.setItem(LS_STATE, JSON.stringify(data.data));
      loadState();
      setSync('Synced');
      lastSnapshotTs = Date.now(); snapshotNow();
    } else {
      loadState();
      await pushToCloudNow();

    }
  } catch (e) {
    loadState();
    setSync('Offline');
    toast('Cloud not reachable - working on this device only');
  }
}

async function openHistory(ev) {
  ev.stopPropagation();
  if (!currentUser) { alert('Log in to use cloud history.'); return; }
  try {
    const { data, error } = await sb.from('task_snapshots').select('id, created_at').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(50);
    if (error) throw error;
    if (!data || !data.length) { toast('No cloud history yet - it builds up as you edit'); return; }
    openMenu(ev, data.map(r => ({ val: r.id, label: new Date(r.created_at).toLocaleString() })), id => restoreSnapshot(id));
  } catch (e) { alert('Cloud history is not set up yet. Run the task_snapshots SQL in Supabase (see SETUP.md).'); }
}
async function restoreSnapshot(id) {
  try {
    const { data, error } = await sb.from('task_snapshots').select('data').eq('id', id).maybeSingle();
    if (error || !data || !data.data) { alert('Could not load that snapshot.'); return; }
    const d = data.data;
    if (!Array.isArray(d.tasks)) { alert('That snapshot looks incomplete.'); return; }
    if (!confirm('Restore this version (' + d.tasks.length + ' tasks)?\nYour current board is snapshotted first, so this is reversible.')) return;
    await snapshotNow();
    localStorage.setItem(LS_STATE, JSON.stringify({ seed: d.seed || SEED, tasks: d.tasks, nextTaskId: d.nextTaskId }));
    loadState(); renderAll(); await pushToCloudNow();
    toast('Restored earlier version');
  } catch (e) { alert('Restore failed.'); }
}

  }
  const { data } = await sb.auth.getSession();
  if (data.session) { currentUser = data.session.user; await startApp(); return; }

  const acc = readAccess();
  if (acc && acc.mode === 'local') { useLocalOnly(); return; }
  if (acc && acc.email) { const em = document.getElementById('auth-email'); if (em) em.value = acc.email; }
})();
</script>
</body>
</html>
